<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs Now</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="spotify-panel" aria-labelledby="spotify-heading">
        <div class="spotify-header">
          <h1 id="spotify-heading">Spotify</h1>
          <button id="spotify-action" type="button">Connect Spotify</button>
        </div>
        <div id="now-playing" class="now-playing" hidden>
          <img id="album-art" alt="" hidden />
          <div class="track-details">
            <p id="playback-label">Now playing</p>
            <p id="track-name"></p>
            <p id="track-creators"></p>
          </div>
        </div>
        <p id="spotify-status" role="status" aria-live="polite">
          Connect Spotify to see what is playing.
        </p>
      </section>

      <section class="jamming-panel" aria-labelledby="jamming-heading">
        <div class="jamming-header">
          <h2 id="jamming-heading">Jam with Ultimate Guitar</h2>
          <p>Follow each song playing on Spotify.</p>
        </div>
        <div class="jamming-controls">
          <div class="jam-preferences">
            <fieldset class="jam-mode" aria-describedby="jam-mode-help">
              <legend>Jam mode</legend>
              <div class="jam-mode-options">
                <label>
                  <input type="radio" name="jam-mode" value="tabs" />
                  Tabs
                </label>
                <label>
                  <input type="radio" name="jam-mode" value="chords" checked />
                  Chords
                </label>
              </div>
              <span id="jam-mode-help" class="visually-hidden">
                Choose the type of Ultimate Guitar results to open while jamming.
              </span>
            </fieldset>
            <fieldset class="jam-mode" aria-describedby="jam-result-help">
              <legend>Auto-open behavior</legend>
              <div class="jam-mode-options">
                <label>
                  <input type="radio" name="jam-result" value="search" />
                  Search results
                </label>
                <label>
                  <input type="radio" name="jam-result" value="most-rated" checked />
                  Most rated
                </label>
              </div>
              <span id="jam-result-help" class="visually-hidden">
                Choose what opens automatically for each new song.
              </span>
            </fieldset>
          </div>
          <div class="jam-actions">
            <div class="manual-open-actions" aria-label="Open the current track">
              <button id="open-search-results" type="button" data-jam-result="search">
                Open search results
              </button>
              <button id="open-most-rated" type="button" data-jam-result="most-rated">
                Open most rated
              </button>
            </div>
            <button id="jamming-action" type="button">Start jamming</button>
          </div>
        </div>
        <p id="jamming-status" role="status" aria-live="polite"></p>
      </section>
      <section id="queue-panel" class="queue-panel" aria-labelledby="queue-heading" hidden>
        <h2 id="queue-heading">Up next</h2>
        <ol id="queue-list" class="queue-list"></ol>
        <p id="queue-status" role="status" aria-live="polite"></p>
      </section>
      <a class="settings-link" href="../options/options.html" target="_blank">Settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
